[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pmo-assistant"
version = "0.1.0"
description = "個人用 AI PMO アシスタント（Phase 1 MVP）"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "streamlit>=1.36", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
